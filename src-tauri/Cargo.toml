[package]
name = "linkeding-prospect-assistant"
version = "0.1.0"
description = "Desktop assistant for LinkedIn prospecting workflows"
authors = ["Linkeding Prospect Assistant"]
edition = "2021"

[lib]
name = "linkeding_prospect_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
