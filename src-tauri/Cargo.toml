[package]
name = "linkedin_prospect_assistant"
version = "0.1.0"
edition = "2021"

[lib]
name = "linkedin_prospect_assistant"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
name = "linkeding-prospect-assistant"
version = "0.1.0"
description = "Desktop assistant for LinkedIn prospecting workflows"
authors = ["Linkeding Prospect Assistant"]
edition = "2021"

[lib]
name = "linkeding_prospect_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
